<style>
/* Layout: field of play + step panel side by side; results card, rule cards and source note full width below. Same family as the 25m Pistol Women Final Simulator, recoloured in the teal and gold of the 10m Finals Manual. */
:root{
  --bg:#EEF2F1; --panel:#FFFFFF; --panel2:#F5F8F7; --ink:#14262A; --muted:#566B6E; --line:#D5DFDD;
  --accent:#B9822A; --accent-ink:#FFFFFF; --navy:#0F4C4F; --navy-ink:#FFFFFF;
  --field:#2E6F6B; --field2:#275F5C; --fp:#0F4C4F; --wait:#F2DDB0; --ammo:#D6E8E6; --ammo-ink:#0F4C4F; --target:#FFFFFF;
  --hit:#2FB463; --miss:#D93B36; --good:#1E8E4E; --bad:#C2332E; --warn:#B86A00;
  --f-body:Arial, "Geeza Pro", "SF Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-disp:Arial, "Geeza Pro", "SF Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-mono:ui-monospace, Menlo, Consolas, "Roboto Mono", "Courier New", monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1716; --panel:#142321; --panel2:#1A2C2A; --ink:#E5EFED; --muted:#97ABA8; --line:#28403D;
  --accent:#E0AE55; --accent-ink:#1A1206; --navy:#17605F; --navy-ink:#FFFFFF;
  --field:#215653; --field2:#1B4A47; --fp:#0F3A3C; --wait:#C9A46A; --ammo:#B6D3CF; --ammo-ink:#0F3A3C; --target:#F1F4F8;
  --hit:#3CCB75; --miss:#FF6A63; --good:#49C27E; --bad:#FF6A63; --warn:#E5A23A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1716; --panel:#142321; --panel2:#1A2C2A; --ink:#E5EFED; --muted:#97ABA8; --line:#28403D;
  --accent:#E0AE55; --accent-ink:#1A1206; --navy:#17605F; --navy-ink:#FFFFFF;
  --field:#215653; --field2:#1B4A47; --fp:#0F3A3C; --wait:#C9A46A; --ammo:#B6D3CF; --ammo-ink:#0F3A3C; --target:#F1F4F8;
  --hit:#3CCB75; --miss:#FF6A63; --good:#49C27E; --bad:#FF6A63; --warn:#E5A23A; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:18px 36px}
.wrap{max-width:1240px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
button,select,input{font:inherit; color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.hdr{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:flex-start}
.eyebrow{font-size:13px; color:var(--muted); margin:0}
h1{font-family:var(--f-disp); font-weight:700; font-size:clamp(28px,4vw,42px); line-height:1.15; margin:2px 0 4px; text-wrap:balance}
.lead{margin:0; color:var(--muted); max-width:62ch}
.hdr-side{display:flex; flex-direction:column; gap:10px; align-items:flex-end}
.langbtn{border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:6px 16px; font-weight:700; cursor:pointer}
.phasechips{display:flex; gap:6px; flex-wrap:wrap}
.pchip{border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:999px; padding:4px 12px; font-size:13px; cursor:pointer}
.pchip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
nav.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line)}
nav.tabs button{border:0; background:none; padding:9px 14px; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:700}
.main{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:16px; align-items:start}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}}
.col{display:flex; flex-direction:column; gap:16px; min-width:0}
.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; min-width:0}
.card h2{font-family:var(--f-disp); font-size:18px; margin:0 0 8px; font-weight:700}
.fieldcard{padding:10px}
#field{display:block; width:100%; height:auto; border-radius:10px}
.tok{transition:transform .8s cubic-bezier(.4,.1,.2,1), opacity .4s}
@media (prefers-reduced-motion:reduce){.tok{transition:none}}
.timer{display:flex; align-items:center; gap:10px; padding:8px 6px 2px; font-size:13px; color:var(--muted)}
.timer .t{font-family:var(--f-mono); font-weight:600; color:var(--ink); min-width:4.2ch; direction:ltr}
.timer .bar{flex:1; height:8px; border-radius:6px; background:var(--panel2); border:1px solid var(--line); overflow:hidden}
.timer .bar i{display:block; height:100%; width:0; background:var(--hit)}
.legend{display:flex; flex-wrap:wrap; gap:4px 16px; font-size:12.5px; color:var(--muted); padding:6px}
.legend span{display:inline-flex; gap:6px; align-items:center}
.sw{width:12px; height:12px; border-radius:3px; display:inline-block}
.sw.c{border-radius:50%}
.stephead{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
.tag{font-family:var(--f-mono); font-size:11.5px; border:1px dashed var(--line); padding:2px 8px; border-radius:6px; color:var(--muted)}
.steptitle{font-family:var(--f-disp); font-size:22px; font-weight:700; margin:6px 0 10px; line-height:1.35}
.cmdbox{background:var(--navy); color:var(--navy-ink); border-radius:10px; padding:10px 14px; margin-bottom:10px}
.cmdbox .cap{font-size:12px; opacity:.8; margin-bottom:4px}
.cmdrow{display:grid; grid-template-columns:1fr auto; gap:2px 12px; padding:5px 0; border-top:1px solid rgba(255,255,255,.12)}
.cmdrow:first-of-type{border-top:0}
.cmdrow .c{font-family:var(--f-mono); font-weight:600; font-size:14px; direction:ltr; text-align:start; overflow-wrap:anywhere}
body[dir="rtl"] .cmdrow .c{text-align:right}
.cmdrow .at{font-family:var(--f-mono); font-size:12.5px; opacity:.85; direction:ltr}
.desc{margin:0 0 10px}
.chip{display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; font-size:12px; font-weight:700; border:1px solid rgba(0,0,0,.25); vertical-align:-5px; font-family:var(--f-mono)}
.ref{font-size:12px; color:var(--muted); font-family:var(--f-mono)}
.trainbtn{width:100%; border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:9px 12px; cursor:pointer; font-weight:700}
.trainbtn:hover{border-color:var(--accent)}
.trainer{border:1.5px solid var(--field); border-radius:12px; padding:14px; margin-top:10px; background:var(--panel)}
.trainer[hidden]{display:none!important}
.trow{display:flex; justify-content:space-between; align-items:center; gap:10px}
.tcount{font-family:var(--f-mono); font-weight:600; font-size:30px; line-height:1; direction:ltr}
.tstage{display:flex; align-items:center; gap:8px; font-weight:700}
.tdot{width:16px; height:16px; border-radius:50%; background:var(--line)}
.tdot.red{background:var(--miss)} .tdot.green{background:var(--hit)}
.saybox{background:var(--navy); color:var(--navy-ink); border-radius:10px; padding:10px 14px; margin:10px 0 6px; transition:background .2s}
.saybox.now{background:var(--accent); color:var(--accent-ink)}
.saybox.idle{background:color-mix(in srgb, var(--navy) 55%, var(--panel))}
.saybox .cap{font-size:12px; opacity:.85}
.saybox .say{font-family:var(--f-mono); font-weight:600; font-size:clamp(16px,2vw,20px); direction:ltr; text-align:start; overflow-wrap:anywhere; min-height:1.4em}
body[dir="rtl"] .saybox .say{text-align:right}
.thint{font-size:12.5px; color:var(--muted); margin:0 0 10px}
.tbtns{display:flex; gap:8px; flex-wrap:wrap}
.checks{display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:13px}
.checks label{display:inline-flex; gap:6px; align-items:center; cursor:pointer}
.ctrls{display:flex; flex-direction:column; gap:12px}
.navrow{display:grid; grid-template-columns:auto 1fr auto; gap:8px}
.btn{border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:9px 14px; cursor:pointer; font-weight:500}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
input[type="range"]{width:100%; accent-color:var(--accent)}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.seg button{border:0; background:var(--panel); padding:4px 10px; cursor:pointer; font-family:var(--f-mono); font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
select, input[type="text"]{border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:7px 9px; min-width:0}
.grow{flex:1; min-width:0}
.small{font-size:12.5px; color:var(--muted)}
details summary{cursor:pointer; font-weight:700}
.names{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:4px}
.names label{display:flex; gap:6px; align-items:center}
.names .noc{flex:0 0 64px; width:64px; text-transform:uppercase; text-align:center; font-family:var(--f-mono)}
.toggle{display:flex; gap:10px; align-items:center; font-weight:700; cursor:pointer; min-height:44px}
.toggle input{width:22px; height:22px}
#namespaste{width:100%; margin-top:10px; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:8px; font:inherit; font-size:16px; resize:vertical; unicode-bidi:plaintext; text-align:start}
.namesopt{border-top:1px solid var(--line); padding-top:6px}
.names input{width:100%}
.gate{border:1.5px solid var(--accent); border-radius:12px; padding:12px; margin-top:10px; background:color-mix(in srgb, var(--accent) 6%, var(--panel))}
.gate[hidden]{display:none!important}
.gate h3{margin:0 0 8px; font-size:15px}
.opts{display:flex; flex-direction:column; gap:6px}
.opt{text-align:start; border:1px solid var(--line); background:var(--panel); border-radius:9px; padding:8px 11px; cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--panel))}
.opt.wrong{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--panel))}
.tw{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums}
th{font-size:12px; color:var(--muted); font-weight:500; padding:6px; border-bottom:1px solid var(--line); text-align:start; white-space:nowrap}
td{padding:6px; border-bottom:1px solid var(--line); white-space:nowrap}
tr.shoot td{background:color-mix(in srgb, var(--accent) 12%, transparent)}
tr.out td{color:var(--muted)}
.dots{display:inline-flex; gap:3px; direction:ltr}
.dots i{width:10px; height:10px; border-radius:50%; border:1.5px solid var(--line); display:inline-block}
.dots i.h{background:var(--hit); border-color:var(--hit)}
.dots i.m{border-color:var(--miss)}
.pill{display:inline-block; font-size:12px; border:1px solid var(--line); border-radius:999px; padding:1px 9px}
.pill.shoot{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.pill.g{border-color:#C9A227; color:#9A7A0E} .pill.s{border-color:#8E99A6} .pill.b{border-color:#B57A44; color:#9A5E2A}
.pill.out{color:var(--muted)}
.tot{font-weight:700}
.rescard td,.rescard th{text-align:center}
.rescard td:first-child,.rescard th:first-child{text-align:start}
.cur{background:color-mix(in srgb, var(--accent) 10%, transparent)}
.infos{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px}
.info h3{font-family:var(--f-disp); font-size:17px; margin:0 0 6px}
.info p{margin:0; font-size:13.5px; color:var(--muted)}
.src{font-size:12.5px; color:var(--muted); margin:0}
.langbtn[aria-pressed="false"]{color:var(--muted); border-style:dashed}
.byline{margin:6px 0 0; font-size:13px; font-weight:700; color:var(--accent); letter-spacing:.02em}
.byline-foot{font-weight:700}
.designer{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
.casecard{max-width:760px; margin:0 auto; width:100%}
.shots{display:flex; gap:10px; margin:10px 0; direction:ltr; justify-content:flex-start}
body[dir="rtl"] .shots{justify-content:flex-end}
.shot{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; color:var(--muted); font-family:var(--f-mono)}
.shot b{width:30px; height:30px; border-radius:50%; border:2px solid #222; background:var(--target); display:block}
.shot b.h{background:var(--hit); border-color:#145c32}
.shot b.m{border-color:var(--miss); border-width:4px}
.shot b.u{background:repeating-linear-gradient(45deg,#bbb 0 3px,#e4e4e4 3px 6px)}
.shot b.z{background:var(--target);border:3px dashed #3E8FD8}
.shot b.l{background:var(--warn); border-color:#6b3d00}
.q{font-weight:700; margin:8px 0}
.ex{margin-top:10px; font-size:14px}
.casenav{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.casenav .primary{flex:1}
.score{font-family:var(--f-mono); font-size:13px; color:var(--muted)}
/* computers */
.kbd{display:none}
@media (hover:hover) and (pointer:fine){ .kbd{display:block} }
.kbd kbd{font-family:var(--f-mono); font-size:11.5px; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; background:var(--panel2)}
@media (min-width:1500px){ .wrap{max-width:1480px} .steptitle{font-size:24px} body{font-size:16px} }
:fullscreen body, body.fs{padding-block:12px} 
:fullscreen .wrap{max-width:none}
/* touch + phones */
button,select,summary,.opt,input[type="checkbox"]{touch-action:manipulation}
.btn,.trainbtn,select,.langbtn,nav.tabs button{min-height:44px}
.pchip,.seg button{min-height:36px}
input[type="checkbox"]{width:20px; height:20px; accent-color:var(--accent)}
.opt{min-height:44px}
@media (max-width:640px){

  .card{padding:13px}
  .fieldcard{padding:6px}
  .navrow{position:fixed; z-index:30; left:0; right:0; bottom:0; margin:0; padding:10px max(12px, env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px)); background:color-mix(in srgb, var(--panel) 94%, transparent); border-top:1px solid var(--line); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px)}
  .navrow .btn{min-height:50px; font-size:16px}
  th,td{padding:6px 5px; font-size:13.5px}
  .names{grid-template-columns:minmax(0,1fr)}
  .casenav .btn{flex:1 1 40%}
  .tcount{font-size:36px}
}
 .annbox{border:1px dashed var(--accent);border-radius:10px;padding:8px 12px;margin-bottom:10px;background:color-mix(in srgb, var(--accent) 7%, var(--panel))}
.annbox .cap{font-size:12px;color:var(--muted);margin-bottom:2px}
.annbox .c{font-size:13.5px;direction:ltr;text-align:start;overflow-wrap:anywhere}
body[dir="rtl"] .annbox .c{text-align:right}
#results tr.grp td{background:var(--panel2)}
</style>
<style>

<style>
/* Full results card sits under the field of play (left column) */
.rescard{padding:12px 10px}

.rescard .tw{overflow-x:auto}

</style>
<style>
/* ===== mobile phones ===== */

/* ================= results plans ================= */
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function shotVal(skill){ return DISC==="r"
  ? (()=>{ let v=Math.round(skill+gauss()*3.6); if(Math.random()<.03) v-=4+Math.floor(Math.random()*8); return Math.max(85,Math.min(109,v)); })()
  : (()=>{ let v=Math.round(skill+gauss()*7); if(Math.random()<.04) v-=8+Math.floor(Math.random()*10); return Math.max(60,Math.min(109,v)); })(); }
function makePlan(){
  const p={v:{},so:{},rep:{},sight:{}};
  POS.forEach(x=>{ const skill=DISC==="r"?103.4+Math.random()*1.8:96+Math.random()*4;
    p.v[x]=[null]; for(let k=1;k<=24;k++) p.v[x].push(shotVal(skill));
    p.so[x]=[]; for(let r=0;r<12;r++) p.so[x].push(shotVal(skill));
    p.rep[x]=[0,1,2,3,4].map(()=>shotVal(skill));
    p.sight[x]=[0,1,2,3,4,5].map(()=>shotVal(skill-(DISC==="r"?1:3))); });
  return p;
}
const IRR={4:[{t:"late",p:"C"}],5:[{t:"dnsT",p:"F"}],6:[{t:"dry",p:"B"}],7:[{t:"afterStop",p:"G"}],8:[{t:"loadEarly",p:"E",k:17}],9:[{t:"extra",p:"A",s:1}],
 10:[{t:"malf1",p:"D",k:16}],11:[{t:"malfS",p:"H",s:2,shot:2}],12:[{t:"zero",p:"C",k:17}],13:[{t:"claim",p:"B",k:16}],14:[{t:"protest",p:"F",k:17}],15:[{t:"timeout",p:"E",s:2}],
 16:[{t:"late",p:"C"},{t:"dry",p:"B"},{t:"extra",p:"A",s:1},{t:"timeout",p:"E",s:2},{t:"malfS",p:"H",s:3,shot:3},{t:"loadEarly",p:"E",k:16},{t:"claim",p:"B",k:16},{t:"malf1",p:"D",k:17},{t:"zero",p:"G",k:17},{t:"protest",p:"F",k:18}]};
function planFor(kind){
  for(let i=0;i<9000;i++){
    const p=makePlan(); if(IRR[kind]) p.irr=IRR[kind];
    const r=simulate(p,NAMES,true); const ev=r.events; if(r.bad) continue;
    if(kind===0 && !ev.length) return p;
    if(kind===1 && ev.some(e=>e.s===18)) return p;
    if(kind===2 && ev.some(e=>e.s===21)) return p;
    if(kind===3 && ev.some(e=>e.s===24)) return p;
    if(kind>=4 && !ev.length) return p;
  }
  const p=makePlan(); if(IRR[kind]) p.irr=IRR[kind]; return p;
}

function simulate(plan,names,quick){

  }

  const need=p=>{ if(TM[teamOf(p)].status!=="active"){ bad=true; return false; } return true; };

  /* ---- before the Final ---- */
  push({ph:0,tag:BEFORE,title:{ar:"الحضور: 30 دقيقة قبل البداية",en:"Reporting: 30 min before the Start Time"},

          en:`The Start Time is when the CRO begins the commands for the first competition shot. All eight athletes report to the preparation area at least 30 minutes before, with all equipment and a national team uniform for the ceremony; each team may have one coach. Jury Members and Range Officers complete their checks${D(" and trigger weighing","")} in the preparation area.`+D(""," Live Aiming devices are fitted to the rifles, overseen by RTS and Sport Presentation officials.")},

  IRRS.filter(x=>x.t==="late").forEach(x=>{ const p=x.p; A[p].pen[1]=(A[p].pen[1]||0)-20; irrNotes.push({ar:`حضور متأخر (${p})`,en:`late reporting (${p})`});

function renderIrr(){ const tt=t(); $("tab-irr").textContent=tt.tabIrr; $("irrh").textContent=tt.irrH; $("irrsub").textContent=tt.irrSub;
  let h=`<thead><tr>${tt.irrCols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`;
  IRRT.forEach(x=>{ if(x.g){ h+=`<tr class="grp"><td colspan="4">${esc(L(x.g))}</td></tr>`; return; }
    const ix=IRRT.indexOf(x), open=IRR_OPEN.has(ix), ar=lang==="ar";
    h+=`<tr class="${open?"open":""}"><td>${esc(L(x.h))}</td><td class="ans">${open?`<span class="anstext">${esc(L(x.p))}</span> <button class="btn say" data-say="${ix}" title="${ar?"استمع مرة أخرى":"Listen again"}" aria-label="${ar?"استمع مرة أخرى":"Listen again"}">🔊</button>`:`<button class="btn sel" data-sel="${ix}">${ar?"◉ اختر · اعرض العقوبة":"◉ Select · show penalty"}</button>`}</td><td class="ref">${open?"ISSF "+esc(x.r):""}</td><td>${x.sc?`<button class="btn" data-sc="${x.sc}" data-nth="${x.nth||1}">${esc(tt.show)}</button>`:""}</td></tr>`; });
  $("irrtable").innerHTML=h+"</tbody>"; irrBar();
  $("irrsub").textContent=lang==="ar"?"اضغط «اختر» بجانب أي مخالفة لتظهر العقوبة ورقم القاعدة مع قراءتها صوتياً (🔊 للإعادة). «عرض في المحاكي» يعرض الحالة خطوة بخطوة.":"Press Select next to any irregularity to reveal the penalty and rule and hear them read aloud (🔊 to replay). Show in simulator plays the case step by step."; }
/* select an irregularity → its penalty appears and is read aloud */
let IRR_OPEN=new Set();
function irrBar(){ let d=$("irrbar"); const ar=lang==="ar";
  if(!d){ d=document.createElement("div"); d.id="irrbar"; const tw=$("irrtable").closest(".tw")||$("irrtable"); tw.parentNode.insertBefore(d,tw);
    d.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
      if(b.dataset.act==="all"){ IRRT.forEach((x,i)=>{ if(!x.g) IRR_OPEN.add(i); }); renderIrr(); }
      if(b.dataset.act==="none"){ IRR_OPEN.clear(); try{synth&&synth.cancel()}catch(x){} renderIrr(); }
      if(b.dataset.act==="rand"){ const c=IRRT.map((x,i)=>i).filter(i=>!IRRT[i].g&&!IRR_OPEN.has(i)); if(!c.length) return; const i=c[Math.floor(Math.random()*c.length)]; IRR_OPEN.add(i); renderIrr(); sayIrr(i); const r=$("irrtable").querySelector(`[data-say="${i}"]`); if(r) r.closest("tr").scrollIntoView({block:"center",inline:"nearest",behavior:"smooth"}); } }); }
  const n=IRRT.filter(x=>!x.g).length, k=IRR_OPEN.size;
  d.innerHTML=`<button class="btn" data-act="rand">${ar?"🎲 مخالفة عشوائية":"🎲 Random irregularity"}</button><button class="btn" data-act="all">${ar?"اعرض كل العقوبات":"Show all penalties"}</button><button class="btn" data-act="none">${ar?"إخفاء الكل":"Hide all"}</button><span class="small">${ar?`تم عرض ${k} من ${n}`:`${k} of ${n} shown`}</span>`; }
function sayIrr(ix){ const x=IRRT[ix]; if(!x||!synth) return; const ar=lang==="ar";
  const txt=L(x.h)+". "+(ar?"العقوبة: ":"Penalty: ")+L(x.p)+" "+(ar?"القاعدة ":"Rule ")+x.r+".";
  const run=()=>speak(txt); if(!SOUND){ toggleSound(); setTimeout(run,200); } else run(); }
$("irrtable").addEventListener("click",e=>{ const s=e.target.closest("[data-sel]"); if(s){ const ix=+s.dataset.sel; IRR_OPEN.add(ix); renderIrr(); sayIrr(ix); return; }
  const a=e.target.closest("[data-say]"); if(a) sayIrr(+a.dataset.say); });
$("irrtable").addEventListener("click",e=>{ const b=e.target.closest("[data-sc]"); if(!b) return;
  const sc=+b.dataset.sc, nth=+b.dataset.nth; setTab("sim"); newScenario(sc);
  const idx=STEPS.map((s,i)=>s.flag?i:-1).filter(i=>i>=0); const j=idx[Math.min(nth,idx.length)-1];
  if(j!=null) go(j,true); window.scrollTo({top:0,behavior:"smooth"}); });

let CI=0, CANS={};
function renderCase(){
  const tt=t(), c=CASES[CI];
  $("caseno").innerHTML=`${tt.caseNo} <b>${CI+1}</b> ${tt.of} ${CASES.length}`; $("casetag").textContent=tt.caseTag;
  $("casetitle").textContent=L(c.h); $("casetext").textContent=L(c.x); $("caseq").textContent=L(c.q);
  $("caseshots").innerHTML=c.shots?c.shots.map((s,k)=>`<span class="shot"><b class="${s==="0.0"?"z":s==="—"?"u":"h"}">${esc(s)}</b>${k+1}</span>`).join(""):"";
  const box=$("caseopts"); box.innerHTML=""; const ans=CANS[CI];
  c.o.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.textContent=L(o);
    if(ans!=null){b.disabled=true; if(k===c.a)b.classList.add("right"); else if(k===ans)b.classList.add("wrong");}
    b.onclick=()=>{CANS[CI]=k;renderCase();}; box.appendChild(b);});
  $("caseex").innerHTML=ans!=null?`<b>${ans===c.a?tt.right:tt.notq}</b> ${esc(L(c.e))} <span class="ref">ISSF ${c.r}</span>`:"";
  $("cprev").textContent=tt.cprev; $("cnext").textContent=tt.cnext; $("crestart").textContent=tt.crestart; $("clisten").textContent=tt.clisten;
  $("cprev").disabled=CI===0; $("cnext").disabled=CI===CASES.length-1; $("clisten").disabled=!synth;
  const right=Object.entries(CANS).filter(([i,a])=>CASES[i].a===a).length;
  $("cscore").textContent=`${tt.cscore} ${right} / ${Object.keys(CANS).length}`;
}
// shuffle answer positions once per load so the right answer is not always the second option
CASES.forEach(c=>{ const idx=c.o.map((_,i)=>i).sort(()=>Math.random()-.5); const right=c.o[c.a]; c.o=idx.map(i=>c.o[i]); c.a=c.o.indexOf(right); });
$("cprev").onclick=()=>{CI--;renderCase()}; $("cnext").onclick=()=>{CI++;renderCase()};
$("crestart").onclick=()=>{CI=0;CANS={};renderCase()};
$("clisten").onclick=()=>{ if(!SOUND){ SOUND=true; try{localStorage.setItem(KEY+"-sound","1")}catch(e){} render(false); renderCase(); } const c=CASES[CI]; speak(L(c.h)+". "+L(c.x)+" "+L(c.q)+" "+c.o.map((o,k)=>(k+1)+": "+L(o)).join(". "));};

function renderNames(){ const tt=t(); const box=$("names"); box.innerHTML="";
  $("usenames").checked=USE_NAMES; $("usenamesl").textContent=tt.usenames; $("namespanel").hidden=!USE_NAMES;
  $("nameshelp").textContent=tt.nameshelp; $("namespaste").placeholder=tt.pasteph; $("bfill").textContent=tt.fill; $("bclear").textContent=tt.clearn;
  POS.forEach((p,n)=>{const l=document.createElement("label"); l.innerHTML=chip(p);
    const i=document.createElement("input"); i.type="text"; i.id="nm"+p; i.value=ENTRIES[n].name; i.maxLength=24; i.placeholder=tt.famph+" "+p; i.setAttribute("aria-label",tt.famph+" "+p); i.autocomplete="off";
    i.oninput=()=>{ENTRIES[n].name=i.value;}; i.onchange=()=>{ENTRIES[n].name=i.value.trim(); applyNames();};
    const c=document.createElement("input"); c.type="text"; c.className="noc"; c.id="noc"+p; c.value=ENTRIES[n].noc; c.maxLength=3; c.placeholder=tt.nocph; c.setAttribute("aria-label",tt.nocph+" "+p); c.autocomplete="off";
    c.onchange=()=>{ENTRIES[n].noc=c.value.trim().toUpperCase().slice(0,3); c.value=ENTRIES[n].noc; applyNames();};
    l.appendChild(i); l.appendChild(c); box.appendChild(l);}); }
$("usenames").onchange=e=>{ USE_NAMES=e.target.checked; $("namespanel").hidden=!USE_NAMES; applyNames(); };
$("bfill").onclick=()=>{ const lines=$("namespaste").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).slice(0,8);
  lines.forEach((ln,k)=>{ let parts=ln.replace(/^[A-H\d]+[\.\)\-:]\s*/,"").split(/[,;\t]+|\s+/).filter(Boolean); let noc="";
    if(parts.length>1&&/^[A-Z]{3}$/.test(parts[parts.length-1])){ noc=parts.pop(); }
    ENTRIES[k]={name:parts.join(" ").slice(0,24),noc}; });
  if(lines.length){ USE_NAMES=true; $("namespaste").value=""; renderNames(); applyNames(); } };
$("bclear").onclick=()=>{ ENTRIES=POS.map(()=>({name:"",noc:""})); renderNames(); applyNames(); };

function toggleSound(){ SOUND=!SOUND; try{localStorage.setItem(KEY+"-sound",SOUND?"1":"0")}catch(e){}
  if(!SOUND){ VOICE_ON=false; try{synth&&synth.cancel()}catch(e){} }
  else { VOICE_ON=true; beep(880,.08); if(!$("view-cases").hidden){ const c=CASES[CI]; speak(L(c.h)+". "+L(c.x)+" "+L(c.q)); } else speakStep(); }
  render(false); renderCase(); }

document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const tg=e.target; if(tg&&(/^(INPUT|SELECT|TEXTAREA)$/.test(tg.tagName)||tg.isContentEditable)) return;
  const fwd=lang==="ar"?"ArrowLeft":"ArrowRight", back=lang==="ar"?"ArrowRight":"ArrowLeft";
  if(!$("view-sim").hidden){
    if(e.key===fwd||e.key==="PageDown"||e.key==="n"||e.key==="N"){ e.preventDefault(); if(!$("gate").hidden) return; stopPlay(); nextStep(); return; }
    if(e.key===back||e.key==="PageUp"||e.key==="p"||e.key==="P"){ e.preventDefault(); stopPlay(); $("gate").hidden=true; go(I-1,false); return; }
    if(e.key===" "&&!(tg&&tg.tagName==="BUTTON")){ e.preventDefault(); play(); render(false); return; }
    if(e.key==="k"||e.key==="K"){ e.preventDefault(); setPaused(!PAUSED); return; }
    if(e.key==="s"||e.key==="S"){ e.preventDefault(); saveOffline(); return; }
    if(e.key==="t"||e.key==="T"){ e.preventDefault(); TR?closeTrainer():openTrainer(); return; }
    if(e.key==="Home"){ e.preventDefault(); stopPlay(); closeTrainer(); $("gate").hidden=true; go(0,false); return; }
  } else if(!$("view-cases").hidden){
    if(e.key===fwd&&CI<CASES.length-1){ e.preventDefault(); CI++; renderCase(); return; }
    if(e.key===back&&CI>0){ e.preventDefault(); CI--; renderCase(); return; }
    if(/^[1-4]$/.test(e.key)&&CANS[CI]==null){ CANS[CI]=+e.key-1; renderCase(); return; }
  }
  if(e.key==="f"||e.key==="F"){ if(FS_OK){ e.preventDefault(); toggleFS(); } return; }
  if(e.key==="m"||e.key==="M"){ e.preventDefault(); toggleSound(); return; }
  if(e.key==="l"||e.key==="L"){ e.preventDefault(); $("langbtn").click(); return; }
});

  const lbl=()=>lang==="ar"?"⬇ حفظ للاستخدام بدون إنترنت":"⬇ Save for offline use";
  const tip=()=>lang==="ar"?"يحفظ ملف HTML يعمل في أي متصفح على الكمبيوتر أو الموبايل بدون إنترنت":"Saves an HTML file that works in any browser, computer or mobile, without internet";
  const set=()=>{ b.textContent=lbl(); b.title=tip(); b.setAttribute("aria-label",tip()); };
  const lb=$("langbtn"); lb.parentNode.insertBefore(b,lb); set(); lb.addEventListener("click",set);
  const build=()=>{ const o=__OFF; const t=String(o.title).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
    return '<!doctype html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'+(o.theme?'<meta name="theme-color" content="'+o.theme+'">\n':'')+'<title>'+t+'</title>\n'+o.st+'\n<style>html,body{margin:0;padding:0}</style>\n</head>\n<body dir="rtl">\n'+o.wrap+'\n<scr'+'ipt>'+o.js+'</scr'+'ipt>\n</body>\n</html>\n'; };
  return;   /* replaced by the header "Save for offline use" button (#savebtn) */
  window.claude.use("downloads").then(d=>{ if(!d) return; b.hidden=false;

      catch(err){ const c=err&&err.code; if(["unavailable","not_granted","capability_disabled","capability_removed","rejected_extension","extension_not_enabled"].includes(c)) b.hidden=true; } };
  }).catch(()=>{});
})();
